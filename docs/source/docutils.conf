# Docutils settings for the Sphinx build.
#
# Exhale generates api/class_view_hierarchy.rst.include and
# api/file_view_hierarchy.rst.include with the whole hierarchy on a single
# line - line 11 of each is far past docutils' 10 000-character default - and
# docutils reports "line exceeds the line-length-limit". With Sphinx run under
# -W (see ANTfrastructure's docs-build.sh) those two warnings failed the entire
# docs build on 2026-08-06.
#
# The limit exists to stop pathological input from hanging the parser; it is
# not a style rule, and these two files are machine-generated from the API
# tree, so their line length grows with the codebase and no amount of editing
# on our side will shorten them. Raising it for this build is the fix;
# suppressing the warning class would also hide it for hand-written pages,
# where a runaway line IS worth knowing about.
#
# Sphinx reads docutils.conf from the CONFIGURATION directory (the one with
# conf.py). A copy also sits in docs/ for a bare docutils/`make` invocation.
[restructuredtext parser]
line_length_limit = 500000
