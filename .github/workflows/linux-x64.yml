name: Linux x64 · build + test

# The one build lane every push to develop runs; release.yml calls it on main (https://github.com/Kataglyphis/ANTfrastructure/blob/develop/docs/branch-and-release-strategy.md).

on:
  push:
    branches: [develop]
    # A docs-only commit must neither spend a build nor cancel an in-flight code run.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main, develop]
  # The GUI input sweep alone, weekly: too slow for a push (docs/source/gpu-golden-testing.md).
  schedule:
    - cron: '17 3 * * 0'
  # Tests a docs-only fix the suite pins (docs/source/gpu-golden-testing.md's golden counts), which paths-ignore skips.
  workflow_dispatch:
    inputs:
      split-jobs:
        description: Run the bundled jobs as their parts again
        type: boolean
        default: false
      gui-sweep:
        description: Run only the GUI input sweep, as the weekly schedule does
        type: boolean
        default: false
  workflow_call:

# Per lane and caller (github.workflow is the caller's name when called), the sweep in its own; main's runs are never cancelled.
concurrency:
  group: linux-x64-${{ github.ref }}-${{ github.workflow }}${{ (github.event_name == 'schedule' || inputs.gui-sweep) && '-gui-sweep' || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Minutes on the bare runner: the scripts against synthetic inputs (the release collector's suite is the hub's).
  deb-layout:
    name: Script suites
    if: ${{ github.event_name != 'schedule' && !inputs.gui-sweep }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The hub for its harness, OxidANT for the bridge's crates and the libraries whose license texts ship.
      - name: Fetch the hub and the license sources
        run: >-
          git submodule update --init --depth 1 third_party/ANTfrastructure third_party/OxidANT
          third_party/GLFW third_party/IMGUI third_party/STB third_party/GLM third_party/TINY_OBJ_LOADER
          third_party/VULKAN_MEMORY_ALLOCATOR third_party/SPDLOG third_party/NLOHMANN_JSON
          third_party/tomlplusplus

      - name: check-deb-layout.sh against synthetic .debs
        run: bash scripts/linux/tests/test-check-deb-layout.sh

      - name: Verify installed Sponza license and notice
        run: bash scripts/linux/tests/test-sponza-package-license.sh
      - name: Third-party and Cargo license texts in a real package
        run: bash scripts/linux/tests/test-third-party-package-licenses.sh

      - name: docs-build-web.sh's wasm-bindgen pin from LF, CRLF and pin-less Cargo.lock files
        run: bash scripts/linux/tests/test-docs-build-web.sh
      - name: Locked documentation environment wrapper
        run: bash scripts/linux/tests/test-uv-sync-project.sh

  build-x64:
    if: ${{ github.event_name != 'schedule' && !inputs.gui-sweep }}
    uses: ./.github/workflows/reusable-linux.yml
    # No timeout-minutes: GitHub rejects it on a job that calls a reusable workflow.
    permissions:
      contents: read
      # The reusable build's compiler-cache writers delete their key's older entries.
      actions: write
    with:
      split-jobs: ${{ inputs.split-jobs || false }}
      runner: ubuntu-26.04
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      GHCR_PAT: ${{ secrets.GHCR_PAT }}

  # The site the release job uploaded: the hub stages it, checks its links and publishes it from develop and main (hub docs-sites.md).
  docs:
    needs: build-x64
    # A red test elsewhere in the build must not hold back the site; the site's own steps decide.
    if: ${{ !cancelled() && github.event_name != 'schedule' && !inputs.gui-sweep }}
    uses: Kataglyphis/ANTfrastructure/.github/workflows/build-docs.yml@develop
    with:
      artifact: bb-docs-site
      # The demo's 61 MB Colosseum-web.glb alone takes the server 14+ min; 30 cut it off on every run from 2026-11-16.
      publish-timeout-minutes: 90
    secrets:
      FTP_SERVER: ${{ secrets.SERVER }}
      FTP_USERNAME: ${{ secrets.USERNAME }}
      FTP_PASSWORD: ${{ secrets.PW }}

  # Inside the image every library is present; the bare image base shows a missing one (hub linux-build-basics.md).
  clean-host-x64:
    name: Packages on a clean Ubuntu 26.04 (x64)
    needs: build-x64
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Install and start the packages
        uses: Kataglyphis/ANTfrastructure/.github/actions/clean-host-package-check@develop
        with:
          artifact: linux-packages-x64
          deb: '*.deb'
          deb-command: GraphicsEngine --version
          tarball: '*.tar.gz'
          tarball-command: ./bin/GraphicsEngine --version
          appimage: '*.AppImage'
          appimage-command: '"$APPIMAGE" --version'

  # The one test no push runs (docs/source/gpu-golden-testing.md): llvmpipe under Xvfb with sync validation, as clang-tests.
  gui-sweep:
    name: GUI input sweep (llvmpipe)
    if: ${{ github.event_name == 'schedule' || inputs.gui-sweep }}
    runs-on: ubuntu-26.04
    # A debug build like clang-tests', then the sweep: 22 min in all, 862 s of sweep, on its first run (43948778560).
    timeout-minutes: 120
    steps:
      - name: Prepare host
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-linux-ci-host@develop
        with:
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_PAT }}

      # Reads clang-tests' debug cache and never writes it: same preset, same objects.
      - name: Restore compiler cache
        id: cc
        uses: Kataglyphis/ANTfrastructure/.github/actions/compiler-cache-restore@develop
        with:
          key: ${{ runner.arch }}-clang-debug
          mounts: 'sccache:/var/cache/sccache'
          env: 'SCCACHE_CACHE_SIZE=1500M'

      - name: Configure/build
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          extra-args: ${{ steps.cc.outputs.docker-args }}
          script: >-
            bash ./scripts/linux/cmake-configure-build.sh
            --preset "linux-debug-clang"
            --build-dir build
          log-file: output.log

      # ctest's 1500 s default stopped it on a 4-vCPU runner (run 36627716804); --no-tests=error catches a renamed test.
      - name: Run the GUI input sweep
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          script: >-
            bash ./scripts/linux/run-ctest.sh --virtual-display
            --build-dir build
            --build-type Debug
            -- -R "^GoldenRender\.GuiInputSweepNeverCrashesOrLosesTheDevice$"
            --timeout 3600 --no-tests=error
          log-file: output.log
