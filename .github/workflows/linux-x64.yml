name: Linux x64 · build + test

on:
  push:
    branches: [main, develop]
    # A docs-only commit must neither spend a build nor cancel an in-flight code run.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main, develop]
  # Tests a docs-only fix the suite pins (docs/gpu-golden-testing.md's golden counts), which paths-ignore skips.
  workflow_dispatch:

# main is exempt from cancellation: its runs deploy and release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build-x64:
    uses: ./.github/workflows/reusable-linux.yml
    # No timeout-minutes: GitHub rejects it on a job that calls a reusable workflow.
    permissions:
      contents: read
      # The reusable build's compiler-cache writers delete their key's older entries.
      actions: write
    with:
      runner: ubuntu-26.04
    secrets:
      SERVER: ${{ secrets.SERVER }}
      USERNAME: ${{ secrets.USERNAME }}
      PW: ${{ secrets.PW }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
