name: Linux x64 · build + test

# The one build lane every push to develop runs; release.yml calls it on main (https://github.com/Kataglyphis/ANTfrastructure/blob/develop/docs/branch-and-release-strategy.md).

on:
  push:
    branches: [develop]
    # A docs-only commit must neither spend a build nor cancel an in-flight code run.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main, develop]
  # Tests a docs-only fix the suite pins (docs/source/gpu-golden-testing.md's golden counts), which paths-ignore skips.
  workflow_dispatch:
    inputs:
      split-jobs:
        description: Run the bundled jobs as their parts again
        type: boolean
        default: false
  workflow_call:

# Per lane and caller (github.workflow is the caller's name when called); main's runs are never cancelled.
concurrency:
  group: linux-x64-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Seconds on the bare runner: two scripts against synthetic inputs (the release collector's suite is the hub's).
  deb-layout:
    name: Script suites
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only the hub, for its test harness; the vendored libraries stay out.
      - name: Fetch the hub
        run: git submodule update --init --depth 1 third_party/ANTfrastructure

      - name: check-deb-layout.sh against synthetic .debs
        run: bash scripts/linux/tests/test-check-deb-layout.sh

      - name: docs-build-web.sh's wasm-bindgen pin from LF, CRLF and pin-less Cargo.lock files
        run: bash scripts/linux/tests/test-docs-build-web.sh
      - name: Locked documentation environment wrapper
        run: bash scripts/linux/tests/test-uv-sync-project.sh

  build-x64:
    uses: ./.github/workflows/reusable-linux.yml
    # No timeout-minutes: GitHub rejects it on a job that calls a reusable workflow.
    permissions:
      contents: read
      # The reusable build's compiler-cache writers delete their key's older entries.
      actions: write
    with:
      split-jobs: ${{ inputs.split-jobs || false }}
      runner: ubuntu-26.04
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      GHCR_PAT: ${{ secrets.GHCR_PAT }}

  # The site the release job uploaded: the hub stages it, checks its links and publishes it from develop and main (hub docs-sites.md).
  docs:
    needs: build-x64
    # A red test elsewhere in the build must not hold back the site; the site's own steps decide.
    if: ${{ !cancelled() }}
    uses: Kataglyphis/ANTfrastructure/.github/workflows/build-docs.yml@develop
    with:
      artifact: bb-docs-site
    secrets:
      FTP_SERVER: ${{ secrets.SERVER }}
      FTP_USERNAME: ${{ secrets.USERNAME }}
      FTP_PASSWORD: ${{ secrets.PW }}

  # Inside the image every library is present; the bare image base shows a missing one (hub linux-build-basics.md).
  clean-host-x64:
    name: Packages on a clean Ubuntu 26.04 (x64)
    needs: build-x64
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Install and start the packages
        uses: Kataglyphis/ANTfrastructure/.github/actions/clean-host-package-check@develop
        with:
          artifact: linux-packages-x64
          deb: '*.deb'
          deb-command: GraphicsEngine --version
          tarball: '*.tar.gz'
          tarball-command: ./bin/GraphicsEngine --version
          appimage: '*.AppImage'
          appimage-command: '"$APPIMAGE" --version'
