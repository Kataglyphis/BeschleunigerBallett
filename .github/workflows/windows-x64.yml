name: Windows x64 · build + test

# The container half is scripts/windows/Invoke-WindowsLane.ps1, which a local container run executes too.


# On request only (https://github.com/Kataglyphis/ANTfrastructure/blob/develop/docs/branch-and-release-strategy.md): on-request.yml or by hand.
on:
  workflow_dispatch:
  workflow_call:

# Per lane and caller (github.workflow is the caller's name when called); main's runs are never cancelled.
concurrency:
  group: windows-x64-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: Build, test, package (x64)
    uses: Kataglyphis/ANTfrastructure/.github/workflows/container-ci-windows.yml@develop
    with:
      target-arch: amd64
      submodules: 'true'
      build-script: scripts/windows/Invoke-WindowsLane.ps1
      # A self-hosted GPU runner sets KATAGLYPHIS_CI_HAS_GPU=1, dropping -ValidationOnly from the renderer comparisons.
      container-env: |
        KATAGLYPHIS_CI_HAS_GPU=${{ vars.KATAGLYPHIS_CI_HAS_GPU }}
      artifact-name: BeschleunigerBallett-windows-x64
      artifact-dir: dist/windows-x64
      # The GPU suites on lavapipe: the host takes one (the hub image ships its own since CON50, but these run outside the container).
      host-command: |
        # The container's configure fetched the scenes into this bind-mounted workspace; the runner has no cmake on PATH.
        ./scripts/windows/Invoke-LavapipeTests.ps1 -Suite dist/windows-x64-tests/commitTestSuite.exe
      # Build and container tests ~1.5 h, then about an hour of lavapipe on the runner's 4 vCPUs.
      timeout-minutes: 240
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
      # Masked, and passed to the container through an --env-file, never an argument.
      CONTAINER_SECRET_ENV: |
        WEBDAV_HOSTNAME=${{ secrets.WEBDAV_HOSTNAME }}
        WEBDAV_USERNAME=${{ secrets.WEBDAV_USERNAME }}
        WEBDAV_PASSWORD=${{ secrets.WEBDAV_PASSWORD }}
        REMOTE_BASE_PATH=${{ secrets.REMOTE_BASE_PATH }}
        MSIX_CERT_PASSWORD=${{ secrets.MSIX_CERT_PASSWORD }}

  pester-tests:
    runs-on: windows-2025
    # About a minute per run.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Top-level only: the suites read nothing from the nested submodules.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Check locked formatter wiring
        shell: pwsh
        # Rooted: the hub harness resolves a relative -ScriptPath against the hub, not this checkout.
        run: pwsh -NoProfile -File third_party/ANTfrastructure/shared/windows/tests/Test-CmakeUvProjectWiring.ps1 -ScriptPath (Join-Path $PWD 'scripts/windows/Build-Windows.ps1') -CommandName Invoke-CmakeFormatStep

      # The suites use Pester 3.4's dash-less `Should Be`, which the runner's Pester 5 cannot parse.
      - name: Run Pester suites (pinned 3.4.0)
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-pester-suite@develop
        with:
          path: scripts/windows/tests
          version: '3.4.0'

      # The hub's suite over scripts/windows/generated-artifacts.txt; it finds this repo through GITHUB_WORKSPACE.
      - name: Run the hub's generated-artifacts suite
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-pester-suite@develop
        with:
          path: third_party/ANTfrastructure/shared/windows/tests/Repo.GeneratedArtifacts.Tests.ps1
          version: '3.4.0'
