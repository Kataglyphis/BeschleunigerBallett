name: Windows x64 · build + test

# The container half is scripts/windows/Invoke-WindowsLane.ps1, which a local container run executes too.

on:
  push:
    branches: [main, develop]
    # A docs-only commit must neither spend a build nor cancel an in-flight code run.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# main is exempt from cancellation: its runs deploy and release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: Build, test, package (x64)
    uses: Kataglyphis/ANTfrastructure/.github/workflows/container-ci-windows.yml@develop
    with:
      target-arch: amd64
      build-script: scripts/windows/Invoke-WindowsLane.ps1
      # A self-hosted GPU runner sets KATAGLYPHIS_CI_HAS_GPU=1, dropping -ValidationOnly from the renderer comparisons.
      container-env: |
        KATAGLYPHIS_CI_HAS_GPU=${{ vars.KATAGLYPHIS_CI_HAS_GPU }}
      artifact-name: BeschleunigerBallett-windows-x64
      artifact-dir: dist/windows-x64
      # The last green runs of the hand-rolled lane took 2-3 hours.
      timeout-minutes: 240
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
      # Masked, and passed to the container through an --env-file, never an argument.
      CONTAINER_SECRET_ENV: |
        WEBDAV_HOSTNAME=${{ secrets.WEBDAV_HOSTNAME }}
        WEBDAV_USERNAME=${{ secrets.WEBDAV_USERNAME }}
        WEBDAV_PASSWORD=${{ secrets.WEBDAV_PASSWORD }}
        REMOTE_BASE_PATH=${{ secrets.REMOTE_BASE_PATH }}
        MSIX_CERT_PASSWORD=${{ secrets.MSIX_CERT_PASSWORD }}

  pester-tests:
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      # Top-level only: the suites read nothing from the nested submodules.
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: true

      # The suites use Pester 3.4's dash-less `Should Be`, which the runner's Pester 5 cannot parse.
      - name: Run Pester suites (pinned 3.4.0)
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-pester-suite@develop
        with:
          path: scripts/windows/tests
          version: '3.4.0'
