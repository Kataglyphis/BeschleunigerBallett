name: Linux arm64 · build + test

# On request only (https://github.com/Kataglyphis/ANTfrastructure/blob/develop/docs/branch-and-release-strategy.md): on-request.yml or by hand.
on:
  workflow_dispatch:
    inputs:
      split-jobs:
        description: Run the bundled jobs as their parts again
        type: boolean
        default: false
  workflow_call:

# Per lane and caller (github.workflow is the caller's name when called); main's runs are never cancelled.
concurrency:
  group: linux-arm64-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  
jobs:
  build-arm:
    uses: ./.github/workflows/reusable-linux.yml
    # No timeout-minutes: GitHub rejects it on a job that calls a reusable workflow.
    permissions:
      contents: read
      # The reusable build's compiler-cache writers delete their key's older entries.
      actions: write
    with:
      split-jobs: ${{ inputs.split-jobs || false }}
      runner: ubuntu-26.04-arm
    secrets:
      SERVER: ${{ secrets.SERVER }}
      USERNAME: ${{ secrets.USERNAME }}
      PW: ${{ secrets.PW }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      GHCR_PAT: ${{ secrets.GHCR_PAT }}

  # Inside the image every library is present; the bare image base shows a missing one (hub linux-build-basics.md).
  clean-host-arm64:
    name: Packages on a clean Ubuntu 26.04 (arm64)
    needs: build-arm
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    steps:
      - name: Install and start the packages
        uses: Kataglyphis/ANTfrastructure/.github/actions/clean-host-package-check@develop
        with:
          artifact: linux-packages-arm64
          deb: '*.deb'
          deb-command: GraphicsEngine --version
          tarball: '*.tar.gz'
          tarball-command: ./bin/GraphicsEngine --version
          appimage: '*.AppImage'
          appimage-command: '"$APPIMAGE" --version'
