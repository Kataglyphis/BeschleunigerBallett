name: Linux build reusable

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
    secrets:
      SERVER:
        required: true
      USERNAME:
        required: true
      PW:
        required: true
      CODECOV_TOKEN:
        required: true
      GHCR_PAT:
        required: true

# Every build step here pipes through `tee`, and the runner's default shell
# has no pipefail - so for months, failed configures and builds reported
# SUCCESS and only steps without tee (the fuzzer run) ever surfaced failure.
# An explicit `shell: bash` runs with `-eo pipefail`, which unmasks them.
defaults:
  run:
    shell: bash

env:
  BUILD_TYPE: Debug
  GCC_PROFILE_PRESET: linux-profile-GNU
  CLANG_PROFILE_PRESET: linux-profile-clang
  # Vulkan SDK version is NOT set here: the container already exports
  # VULKAN_VERSION (ANTfrastructure linux/Dockerfile.base), and
  # cmake-configure-build.sh only overrides it when --vulkan-version is
  # passed - so repeating it here was redundant.
  # folder/name configuration -- change here to affect the whole workflow
  BUILD_DIR: build
  BUILD_RELEASE_DIR: build-release
  DOCS_OUT: build/build/html
  COVERAGE_JSON: build/coverage.json
  # NO CONTAINER IMAGE IS NAMED IN THIS FILE, and that is the point.
  #
  # The tag used to sit here as `CONTAINER_IMAGE: "...:latest-cross"`, referenced
  # by 34 call sites below. One literal per repo is not drift-free, it is
  # drift-per-repo: a fleet-wide tag bump had to find and edit this line in every
  # consumer, and a consumer that was missed kept building against a tag nobody
  # was rebuilding any more.
  #
  # The value now comes from ANTfrastructure's linux/scripts/01-core/versions.env
  # (IMAGE_REGISTRY_PREFIX + CI_IMAGE_LINUX_TAG), which the four container
  # composite actions carry as the DEFAULT of their `image` input - so every step
  # below OMITS `image:` entirely and inherits it. ANTfrastructure's
  # linux/scripts/verify_ci_image_refs.py, which the lint job's actionlint gate
  # runs against THIS tree, fails on any non-canonical kataglyphis_beschleuniger
  # tag under .github/, so a re-introduced literal cannot pass quietly.
  #
  # Do NOT "make it explicit" by passing an `image:` expression back in: GitHub
  # applies an action default only when the key is ABSENT, so an expression that
  # resolves empty yields an EMPTY image reference rather than the default - a
  # failure that surfaces as a confusing `docker run` error far from its cause.
  #
  # The one step that cannot omit an input, because it calls no action - the ASan
  # fuzz-seed loop, which needs a loop rather than the single command line the
  # action takes - reads the same versions.env through
  # scripts/linux/ci-image-ref.sh. That script's header carries the
  # ":latest-cross, not :latest" rationale this comment used to.

# WHY THIS IS FANNED OUT (2026-08-06)
#
# This was ONE job running everything in sequence: 2h13m for a complete run, of
# which ~94 minutes was five full engine builds one after another. They were
# sequential for a MECHANICAL reason, not a logical one - every step
# reconfigured the same `build` directory in turn (clang debug -> coverage ->
# profiling -> gcc -> gcc profiling), so no two could overlap. Giving each its
# own job gives each its own workspace and the contention disappears; the lane
# now costs about as long as its slowest single build.
#
# Compiler caching was measured FIRST and rejected, so nobody re-proposes it:
# this is a C++20 modules codebase, ccache cannot cache module compilations at
# all (79% of calls uncacheable, 0 hits) and sccache - which does accept them -
# hit 57% on a byte-identical tree yet saved 22 seconds of 5m30s, because the
# hits land on cheap TUs while the expensive work (module BMI generation,
# clang-scan-deps) is uncacheable either way.
#
# The jobs are deliberately INDEPENDENT - no `needs:` - because each has to
# build what it tests anyway (build-coverage-llvm.sh runs compileTestSuite,
# run-static-analysis-format.sh needs compile_commands.json), and shipping a
# multi-GB build tree between jobs as an artifact costs more than rebuilding it
# in parallel.
#
# What is NOT dropped, and why: TSan and the gcc lane each cost ~25 minutes and
# each caught a real defect on 2026-08-06 - a struct-padding comparison bug that
# the plain and ASan runs both passed, and a GCC 16.1.0 ICE no clang lane can
# see. Demoting them to nightly is the obvious way to make this number smaller
# and it would have cost both findings.
#
# The four-step host prologue every job now repeats lives in ANTfrastructure's
# prepare-linux-ci-host action, so a change to the pull retry or the checkout
# flags happens once rather than eleven times.
jobs:
  # ---------------------------------------------------------------------------
  # Lint gates, entirely ANTfrastructure's: shellcheck over this repo's bash,
  # actionlint over its workflows and gitleaks over its tracked tree, all using
  # the pinned, SHA-verified binaries ANTfrastructure bootstraps rather than a
  # second set installed here.
  #
  # Cheap and first-to-finish (~2 min, no image pull, no build), and it covers a
  # class the rest of this lane cannot: `yaml.safe_load` proves a workflow is
  # valid YAML, not valid Actions, and bash only reports a quoting or
  # undefined-function bug when the line finally executes - which for a
  # gcc-lane script can be an hour in.
  #
  # THIS JOB USED TO BE ~120 LINES OF SHELL IN `run:` BLOCKS. All of it - the
  # git-ls-files scope construction, the two empty-list vacuity guards, the
  # run-all-three-then-fail-once accumulator and the gitleaks self-test
  # (clean-tree positive control + planted-PAT canary) - now lives in
  # ANTfrastructure linux/scripts/run-lint-gates.sh and is reached through this
  # repo's one-line wrapper. Brevity is not the point; THIS is:
  #     bash ./scripts/linux/run-lint-gates.sh
  # on a dev box runs exactly what this job runs, which a `run:` block never
  # could. The gate that blocks a merge here is now testable before the push.
  #
  # What upstream carries verbatim, recorded here so the reasons are not lost
  # with the code that used to state them:
  #   - both scopes come from `git ls-files`, NOT a glob. The two globs this
  #     replaced (`scripts/linux/*.sh scripts/linux/lib/*.sh`) do not recurse
  #     and named only the directories somebody remembered: measured 2026-09-07
  #     they expanded to 19 of the 21 tracked first-party scripts, silently
  #     missing scripts/agentic-loop/Run-AgenticLoop.sh and the repo-root
  #     bump-version.sh.
  #   - third_party/ is dropped because the vendored trees are linted in their
  #     own repositories at their own ratchet. Handing the whole workspace to
  #     gitleaks measured 82 findings, every one a generic-api-key false
  #     positive in vendored code, and ZERO in a file this repository owns.
  #     third_party/CMakeLists.txt is still scanned: upstream keeps the tracked
  #     plain FILES inside an excluded directory precisely because they are the
  #     consumer's own.
  #   - the empty-list guards are load-bearing. lint-shell.sh invoked with ZERO
  #     file arguments falls back to its own default scope, ANTfrastructure's
  #     linux/ tree, and would report green having checked none of this
  #     repository's scripts.
  #   - the self-test is what separates "the gate ran and found nothing" from
  #     "the gate never started", and its canary is matched BY PATH because a
  #     scan root that does not exist is exit 0 with gitleaks skipping it.
  #
  # One thing this collapse CHANGES on purpose: the three gates were three
  # steps, so a shellcheck failure ended the job before gitleaks ever ran.
  # Upstream runs all three and fails once at the end, so a triage round sees
  # every finding instead of the first one.
  #
  # ENFORCING, and deliberately without continue-on-error: a finding is either a
  # real leak - rotate the credential and purge it - or a false positive that
  # earns ONE narrow, justified allowlist entry upstream, never a softening of
  # this step.
  # ---------------------------------------------------------------------------
  lint:
    name: shell + workflow + secret lint
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # ANTfrastructure is a TOP-LEVEL submodule and it is the one these gates
          # EXECUTE - all three lint scripts and the aggregator that drives them
          # live inside it - so this deliberately does not recurse; the full
          # recursive tree costs minutes for no benefit here. The other
          # top-level submodules come along with it, and nothing below GRADES
          # them: both scopes drop third_party/.
          submodules: true
          fetch-depth: 1

      # uvx is how the shared aggregator runs ruff; the runner carries no uv.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Lint gates (ANTfrastructure shellcheck + actionlint + gitleaks)
        run: bash ./scripts/linux/run-lint-gates.sh

  # ---------------------------------------------------------------------------
  # clang: the plain Debug build and the unit/integration suite.
  # ---------------------------------------------------------------------------
  clang-tests:
    name: clang debug + tests
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Prepare host
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-linux-ci-host@main
        with:
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_PAT }}

      - name: Prepare for unit/integration tests
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@main
        with:
          script: >-
            bash ./scripts/linux/cmake-configure-build.sh
            --preset "linux-debug-clang"
            --build-dir "${{ env.BUILD_DIR }}"
          log-file: output.log

      - name: Run Unit/Integration tests
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@main
        with:
          script: >-
            bash ./scripts/linux/run-ctest.sh
            --build-dir "${{ env.BUILD_DIR }}"
            --build-type "${{ env.BUILD_TYPE }}"
            --ctest-exclude "^(Integration|GoldenRender)\\.|^BuildIntegrity\\.CompiledShadersAreNotOlder"
          log-file: output.log

  # ---------------------------------------------------------------------------
  # AddressSanitizer + UBSan, and the fuzz seed corpora - which need THIS build:
  # the fuzz targets require project-wide ASan or abseil's container layout
  # mismatches and they SEGV at startup (Test/fuzz/CMakeLists.txt).
  # ---------------------------------------------------------------------------
  asan:
    name: AddressSanitizer + fuzz seeds
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Prepare host
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-linux-ci-host@main
        with:
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_PAT }}

      # AddressSanitizer + UBSan: catches the memory errors the OBJ-loader
      # hardening was about. Non-GPU tests only.
      - name: Configure/build with AddressSanitizer
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@main
        with:
          script: >-
            bash ./scripts/linux/cmake-configure-build.sh
            --preset "linux-debug-asan-clang"
            --build-dir "build-asan-clang"
          log-file: output-asan.log

      # Every target declared in Test/fuzz/CMakeLists.txt runs here.
      # BuildIntegrity.EveryRegisteredFuzzTargetRunsInCi gates this list against
      # those declarations by parsing the loop line below - keep the target list
      # on ONE line, and never spell that anchor text in a comment, or the
      # parser matches the comment instead and reports zero targets.
      #
      # Each target runs INSIDE the image it was built in, like every other
      # test step in this lane. It used to run them straight on the runner
      # host - the only step here that did - which is a different libstdc++
      # (the image builds against /opt/gcc-16.1.0, absent on the host), no
      # llvm-symbolizer (every ASan report came back "invalid path to external
      # symbolizer", unsymbolized frame addresses only), and none of the
      # runtime the engine-linked targets expect. Same docker run shape as the
      # run-in-linux-container action; it is spelled out here because the
      # action takes one command line and this needs a loop that keeps going
      # after a failure.
      #
      # THE ONE STEP IN THIS FILE THAT STILL NAMES AN IMAGE, and it does not
      # name a TAG: scripts/linux/ci-image-ref.sh reads the same ANTfrastructure
      # versions.env that supplies the `image` default every other step here
      # inherits, so this loop and those steps cannot end up on different
      # images. It fails loudly on a missing key rather than returning an empty
      # string, because an empty reference makes `docker run` treat the next
      # argument as the image name and the error then lands nowhere near its
      # cause.
      #
      # Collecting failures instead of aborting on the first is the point of
      # the loop: with `set -e` semantics the first bad target hid the verdict
      # on every target after it, so each round trip revealed exactly one
      # broken fuzzer out of seven.
      #
      # A hanging fuzz target must fail the step, not sit until the 6-hour job
      # cap: on 2026-08-05 the Windows twin of this step spent 68 minutes
      # inside one seed ("con", the Windows console device, which readTextFile
      # opened and then read forever) and had to be killed by hand. Seven
      # targets need well under a minute in total here.
      - name: Run fuzzer tests
        timeout-minutes: 15
        run: |
          image="$(bash ./scripts/linux/ci-image-ref.sh)"
          echo "fuzz seeds run in ${image}"
          failed=""
          for t in first_fuzz_test example_fuzz_test obj_parsing_fuzz_test gltf_parsing_fuzz_test scene_config_fuzz_test shader_file_reader_fuzz_test texture_loading_fuzz_test; do
            exe="build-asan-clang/$t"
            test -x "$exe" || { echo "missing $exe"; exit 1; }
            echo "--- $t"
            if docker run --rm \
                 -v "${{ github.workspace }}:/workspace" \
                 -w /workspace \
                 "${image}" \
                 "./$exe"; then
              echo "--- $t OK"
            else
              echo "::error::fuzz target $t failed"
              failed="$failed $t"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::fuzz targets failed:$failed"
            exit 1
          fi
        working-directory: ${{ github.workspace }}

      - name: Run tests under AddressSanitizer
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@main
        with:
          extra-args: >-
            -e ASAN_OPTIONS="detect_leaks=1:abort_on_error=1"
            -e UBSAN_OPTIONS="print_stacktrace=1:halt_on_error=1"
          script: >-
            bash ./scripts/linux/run-ctest.sh
            --build-dir "build-asan-clang"
            --build-type "${{ env.BUILD_TYPE }}"
            --ctest-exclude "^(Integration|GoldenRender)\.|^BuildIntegrity\.CompiledShadersAreNotOlder"
          log-file: output-asan.log

  # ---------------------------------------------------------------------------
  # ThreadSanitizer.
  # ---------------------------------------------------------------------------
  tsan:
    name: ThreadSanitizer
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Prepare host
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-linux-ci-host@main
        with:
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_PAT }}

      # ThreadSanitizer: the presets existed but nothing ever ran them, so
      # data races could only be found by hand. Non-GPU tests only - the
      # Integration suites need an adapter the CI container does not have.
      - name: Configure/build with ThreadSanitizer
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@main
        with:
          script: >-
            bash ./scripts/linux/cmake-configure-build.sh
            --preset "linux-debug-tsan-clang"
            --build-dir "build-tsan"
          log-file: output-tsan.log

      - name: Run tests under ThreadSanitizer
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@main
        with:
          extra-args: >-
            -e TSAN_OPTIONS="halt_on_error=1:second_deadlock_stack=1"
          script: >-
            bash ./scripts/linux/run-ctest.sh
            --build-dir "build-tsan"
            --build-type "${{ env.BUILD_TYPE }}"
            --ctest-exclude "^(Integration|GoldenRender)\.|^BuildIntegrity\.CompiledShadersAreNotOlder"
          log-file: output-tsan.log

  # ---------------------------------------------------------------------------
  # Coverage. Builds its own tree: build-coverage-llvm.sh runs
  # ${BUILD_DIR}/compileTestSuite and reads the .profraw it leaves behind, so it
  # cannot start from an empty workspace.
  # ---------------------------------------------------------------------------
  coverage:
    name: coverage + codecov
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Prepare host
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-linux-ci-host@main
        with:
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_PAT }}

      - name: Build for coverage
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@main
        with:
          script: >-
            bash ./scripts/linux/cmake-configure-build.sh
            --preset "linux-debug-clang"
            --build-dir "${{ env.BUILD_DIR }}"
          log-file: output.log

      - name: Build Code Coverage
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@main
        with:
          script: >-
            bash ./scripts/linux/build-coverage-llvm.sh
            --build-dir "${{ env.BUILD_DIR }}"
            --coverage-json "${{ env.COVERAGE_JSON }}"
          log-file: output.log

      - name: Codecov
        if: ${{ inputs.runner == 'ubuntu-26.04' }}
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ env.COVERAGE_JSON }}
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: false

  # ---------------------------------------------------------------------------
  # Static analysis. Both analyses stay continue-on-error, as in the single job.
  # ---------------------------------------------------------------------------
  static-analysis:
    name: clang static analysis
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Prepare host
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-linux-ci-host@main
        with:
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_PAT }}

      # run-static-analysis-format.sh refuses to start without
      # ${BUILD_DIR}/compile_commands.json ("Run CMake configure first"), which
      # in the old single job happened to exist only because an earlier step had
      # already built into the same directory.
      - name: Configure/build for analysis
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@main
        with:
          script: >-
            bash ./scripts/linux/cmake-configure-build.sh
            --preset "linux-debug-clang"
            --build-dir "${{ env.BUILD_DIR }}"
          log-file: output.log

      # `clang++ --analyze` runs DIRECTLY here - no CMake, no preset - so it
      # cannot inherit the --gcc-toolchain flags CMakeLists.txt computes for
      # every preset-driven step, and without them clang++ resolves libstdc++
      # headers from the system GCC instead of the image's.
      #
      # Those four lines (resolve the prefix, export CXXFLAGS/LDFLAGS) used to
      # be a `bash -lc` prologue spelled out in THIS step, which meant a human
      # running --only-clang-analyze-html locally analysed against a different
      # toolchain than CI did and had no way to know. They now live inside
      # run-static-analysis-format.sh's run_clang_analyze_html, where the local
      # invocation gets them too - so this step is a plain one-line script call
      # like every other step in this lane.
      - name: Run Clang static analysis (HTML)
        continue-on-error: true
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@main
        with:
          script: >-
            bash ./scripts/linux/run-static-analysis-format.sh
            --only-clang-analyze-html
          log-file: output.log

      - name: Run Clang static analysis (scan-build)
        continue-on-error: true
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@main
        with:
          script: >-
            bash ./scripts/linux/run-static-analysis-format.sh
            --only-scan-build
            --build-dir "${{ env.BUILD_DIR }}"
            --preset "linux-debug-clang"
          log-file: output.log

  # ---------------------------------------------------------------------------
  # clang profiling build + the perf suite.
  # ---------------------------------------------------------------------------
  profiling:
    name: clang profiling + benchmarks
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Prepare host
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-linux-ci-host@main
        with:
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_PAT }}

      - name: Configure/build CMake for Profiling (select preset by compiler)
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@main
        with:
          script: >-
            bash ./scripts/linux/cmake-configure-build.sh
            --build-dir "${{ env.BUILD_DIR }}"
            --preset "${{ env.CLANG_PROFILE_PRESET }}"
            --clean-build-dir true
          log-file: output.log

      - name: Run performance benchmarks
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@main
        with:
          script: bash ./scripts/linux/run-perf-suite.sh "${{ env.BUILD_DIR }}"
          log-file: output.log

  # ---------------------------------------------------------------------------
  # The Rust bridge and the wasm demo are both compiled from this crate
  # elsewhere in this lane, but neither runs its ~150 tests - this is the only
  # place in this repo that does. GPU-touching tests self-skip without an
  # adapter (see scripts/linux/run-cargo-tests.sh). ARM does not pay for a
  # second run of the same crate's CPU-only tests.
  # ---------------------------------------------------------------------------
  rust:
    name: Rust renderer tests
    if: ${{ inputs.runner == 'ubuntu-26.04' }}
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Prepare host
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-linux-ci-host@main
        with:
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_PAT }}

      - name: Run Rust renderer tests
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@main
        with:
          script: bash ./scripts/linux/run-cargo-tests.sh
          log-file: output.log

  # ---------------------------------------------------------------------------
  # Docs + wasm demo + deploy.
  #
  # It builds ONLY the doc_doxygen target: Sphinx/Breathe consume the Doxygen
  # XML the C++ build emits, but ANTfrastructure's cmake/Doxygen.cmake declares doc_doxygen as a
  # custom target with no compiled dependencies, so that XML costs a configure
  # plus a doxygen run rather than a ~20-minute engine build.
  # ---------------------------------------------------------------------------
  docs:
    name: docs + wasm demo
    if: ${{ inputs.runner == 'ubuntu-26.04' }}
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Prepare host
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-linux-ci-host@main
        with:
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_PAT }}

      - name: Generate Doxygen XML
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@main
        with:
          script: >-
            bash ./scripts/linux/cmake-configure-build.sh
            --preset "linux-debug-clang"
            --build-dir "${{ env.BUILD_DIR }}"
            --build-target doc_doxygen
          log-file: output.log

      - name: Build web page
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@main
        with:
          script: bash ./scripts/linux/docs-build-web.sh "${{ env.DOCS_OUT }}"

      - name: Enforce wasm demo size budget
        # Deliberately fatal, unlike the best-effort rebuild in "Build web
        # page" above: a wasm bloat regression must block the deploy step
        # below, not surface as a slow page load after it is already live.
        # (It skips itself, loudly, when the image cannot build wasm at all -
        # see scripts/linux/wasm-size-budget.sh.)
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@main
        with:
          script: bash ./scripts/linux/wasm-size-budget.sh

      - name: 📂 Sync files to domain
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        # A flaky FTP upload of the docs must not red the whole build+test lane:
        # the code already compiled and passed both the clang/ASan and gcc test
        # runs before this deploy step. Mirrors the RPT fix (continue-on-error on
        # its FTP deploy) - the docs push is best-effort, not a gate.
        continue-on-error: true
        with:
          server: ${{ secrets.SERVER }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PW }}
          local-dir: "./docs/build/html/"

  # ---------------------------------------------------------------------------
  # gcc: build, tests and coverage. Caught a GCC 16.1.0 ICE on 2026-08-06 that
  # neither clang lane can see, which is why it runs on every push.
  # ---------------------------------------------------------------------------
  gcc:
    name: gcc + tests + coverage
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Prepare host
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-linux-ci-host@main
        with:
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_PAT }}

      - name: Prepare for unit/integration tests (gcc)
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@main
        with:
          script: >-
            bash ./scripts/linux/cmake-configure-build.sh
            --build-dir "${{ env.BUILD_DIR }}"
            --preset "linux-debug-GNU"
            --clean-build-dir true
          log-file: output.log

      - name: Run Unit/Integration tests (gcc)
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@main
        with:
          script: >-
            bash ./scripts/linux/run-ctest.sh
            --build-dir "${{ env.BUILD_DIR }}"
            --build-type "${{ env.BUILD_TYPE }}"
            --ctest-exclude "^(Integration|GoldenRender)\\.|^BuildIntegrity\\.CompiledShadersAreNotOlder"
          log-file: output.log

      # There is deliberately NO fuzz step here. Test/fuzz/CMakeLists.txt builds
      # its targets under clang only, so this job has nothing to run - and the
      # step that used to stand here said so by echoing a sentence and exiting
      # 0. A step named "Run fuzzer tests (gcc)" that runs no fuzzer is a green
      # tick over nothing; the absence is the honest form. Coverage of the
      # targets themselves is the asan job's, and
      # BuildIntegrity.EveryRegisteredFuzzTargetRunsInCi is what proves none of
      # them silently stops running.

      # gcovr walks the build tree for the .gcda files the ctest run above left
      # behind, so it has to stay in the same job as those tests.
      - name: Build Code Coverage (gcc)
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@main
        with:
          script: bash ./scripts/linux/build-coverage-gcovr.sh
          log-file: output.log

  # ---------------------------------------------------------------------------
  # gcc profiling + benchmarks. Split out of the gcc job because it wipes and
  # reconfigures the same build directory (--clean-build-dir true): inside one
  # job it could only ever run after the tests, and that made gcc the longest
  # pole in the fan-out.
  # ---------------------------------------------------------------------------
  gcc-profiling:
    name: gcc profiling + benchmarks
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Prepare host
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-linux-ci-host@main
        with:
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_PAT }}

      - name: Configure/build CMake for Profiling (gcc)
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@main
        with:
          script: >-
            bash ./scripts/linux/cmake-configure-build.sh
            --build-dir "${{ env.BUILD_DIR }}"
            --preset "${{ env.GCC_PROFILE_PRESET }}"
            --clean-build-dir true
          log-file: output.log

      # IN THE CONTAINER, exactly like its clang twin in the profiling job -
      # which calls this same script the same way. This step used to be a bare
      # `run:` on the ubuntu-26.04 host while the binary it executes had just
      # been built INSIDE the image by the step above, so the host's libstdc++
      # was asked to run a binary linked against the image's /opt/gcc-16.x one.
      # It is the identical mismatch this workflow already documents for the
      # ASan fuzz targets, and the identical shape of the "cannot find
      # crtbeginS.o" incident the static-analysis job records: it works only
      # while the host happens to satisfy the link, and the next image GCC bump
      # breaks it.
      #
      # run-perf-suite.sh execs ${BUILD_DIR}/perfTestSuite directly after an
      # `[[ -f ]]` guard, so a non-zero exit from the suite is the step's exit
      # code here just as it was before.
      - name: Run performance benchmarks (gcc)
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@main
        with:
          script: bash ./scripts/linux/run-perf-suite.sh "${{ env.BUILD_DIR }}"
          log-file: output.log

  # ---------------------------------------------------------------------------
  # Release build + packages.
  # ---------------------------------------------------------------------------
  release:
    name: release + package
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Prepare host
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-linux-ci-host@main
        with:
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_PAT }}

      - name: Configure/build CMake for Release
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@main
        with:
          script: >-
            bash ./scripts/linux/cmake-configure-build.sh
            --build-dir "${{ env.BUILD_RELEASE_DIR }}"
            --preset "linux-release-clang"
            --build-config "Release"
          log-file: output.log

      - name: Package
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@main
        with:
          script: >-
            bash ./scripts/linux/cmake-configure-build.sh
            --build-dir "${{ env.BUILD_RELEASE_DIR }}"
            --skip-configure true
            --build-target package
          log-file: output.log

      - name: Upload Linux Packages (Clang only)
        uses: actions/upload-artifact@v7.0.1
        with:
          name: linux-packages
          path: |
            ${{ env.BUILD_RELEASE_DIR }}/*.tar.gz
            ${{ env.BUILD_RELEASE_DIR }}/*.tgz
            ${{ env.BUILD_RELEASE_DIR }}/*.deb
            ${{ env.BUILD_RELEASE_DIR }}/*.AppImage
            ${{ env.BUILD_RELEASE_DIR }}/*.flatpak
