name: Linux x64 · code quality measurements

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  report:
    uses: Kataglyphis/ANTfrastructure/.github/workflows/code-quality-report.yml@develop
    with:
      # Grades the tree against the newest develop record; a regression is reported, an incomplete run fails.
      quality-report: true
