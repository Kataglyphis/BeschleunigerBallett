name: Lint gates

# No paths-ignore on purpose: a docs-only commit still needs the secret scan. See AGENTS.md § Lint gates.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Re-runs the gates after an upstream ANTfrastructure fix without a new commit here.
  workflow_dispatch:

# main is exempt from cancellation: its runs are what a release is cut from.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # 'recursive', the hub's default: a half-checked-out submodule would change what the secret scan sees.
  lint:
    name: shell + workflow + secret + config gates
    uses: Kataglyphis/ANTfrastructure/.github/workflows/lint-gates.yml@develop
    with:
      submodules: 'recursive'
      ratchets: true

  # Keep analyzer diagnostics advisory until the public WebDavPassword parameter is migrated.
  powershell-lint:
    name: PowerShell lint (ANTfrastructure gate)
    uses: Kataglyphis/ANTfrastructure/.github/workflows/powershell-quality.yml@develop
    with:
      lint-path: scripts
      analyzer-strict: false
