name: Lint gates

# No paths-ignore on purpose: a docs-only commit still needs the secret scan. See AGENTS.md § Lint gates.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Re-runs the gates after an upstream ANTfrastructure fix without a new commit here.
  workflow_dispatch:

# main is exempt from cancellation: its runs are what a release is cut from.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # 'recursive': at depth 1 the docs/source/_static/css/custom.css symlink dangles and the '*' gates refuse the tree.
  lint:
    name: shell + workflow + secret + config gates
    uses: Kataglyphis/ANTfrastructure/.github/workflows/lint-gates.yml@develop
    with:
      submodules: 'recursive'
      ratchets: true

  # Not the hub's python-ci-windows lane: that one forces -FailOnAnalyzer and $WebDavPassword is still a String.
  powershell-lint:
    name: PowerShell lint (ANTfrastructure gate)
    runs-on: windows-2025
    # Install-Module can hang; fail in minutes, not at the six-hour default.
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      # Top-level only: ANTfrastructure carries both the gate script and its ruleset.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 1

      # Pinned so a runner-image module refresh cannot change what this gate reports.
      - name: Install PSScriptAnalyzer
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser

      # Parse and AST-trap errors fail the job; without -FailOnAnalyzer only PSScriptAnalyzer is advisory.
      - name: Lint PowerShell (parse gate + PSScriptAnalyzer)
        run: >-
          pwsh -NoProfile -File third_party/ANTfrastructure/windows/scripts/Invoke-Lint.ps1
          -Path scripts
