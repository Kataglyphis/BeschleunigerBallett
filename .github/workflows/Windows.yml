name: CMake on Windows MSVC/Clang x64 (Container)

on:
  push:
    branches: [main, develop]
    # Docs-only commits must not spend a 2-3h build, and - with the
    # cancel-in-progress concurrency below - must not supersede an in-flight
    # code run either. A backlog edit is not a reason to retest the engine.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main, develop]
  # Same escape hatch as Linux_x86.yml: lets a run be requested against the
  # branch tip without inventing a commit. The `[build-win]` gate below is a
  # head_commit check, which is null for a dispatch, so the jobs opt in
  # explicitly on this event instead.
  workflow_dispatch:

# Cancel superseded runs on develop and PRs so the tip's verdict arrives without
# queueing behind stale runs - without this every push spawns a full parallel
# 2-3h run and they serialise. main is exempt: its runs deploy/release and must
# not be interrupted mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# NO CONTAINER IMAGE IS NAMED IN THIS FILE, and that is the point.
#
# The tag used to sit here as `GHCR_IMAGE_WIN: ...:winamd64`, referenced by the
# six container steps below. One literal per repo is not drift-free, it is
# drift-per-repo: a fleet-wide tag bump had to find and edit this line in every
# consumer.
#
# The value now comes from ContainerHub's linux/scripts/01-core/versions.env
# (IMAGE_REGISTRY_PREFIX + CI_IMAGE_WINDOWS_TAG), which prepare-windows-container-host
# and run-in-windows-container carry as the DEFAULT of their `image` input - so
# every step below OMITS `image:` and inherits it. ContainerHub's
# linux/scripts/verify_ci_image_refs.py, which Linux.yml's lint job runs against
# this tree, rejects any non-canonical kataglyphis_beschleuniger tag under
# .github/ AND a Windows action handed the Linux ref, so neither a stale literal
# nor a crossed platform can pass quietly.
#
# Do NOT "make it explicit" by passing an `image:` expression back in: GitHub
# applies an action default only when the key is ABSENT, so an expression that
# resolves empty yields an EMPTY image reference rather than the default.

defaults:
  run:
    shell: pwsh

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-win]')
    runs-on: windows-2025
    permissions:
      contents: read
      packages: read
    steps:

      # Der komplette Prolog - long paths, Checkout ohne Submodule,
      # Kurzpfad-Klon, data-root auf D:, Disk-Cleanup, Registry-Login, Pull,
      # Disk-Report - kommt aus ContainerHub. Er war hier ~60 Zeilen und in drei
      # Schwester-Repos identisch; jede der drei Fallen darin hatte schon eine
      # Lane gekostet.
      #
      # Der Kurzpfad-Klon bleibt Pflicht (MAX_PATH auf der Submodulkette), und
      # required-free-gb ersetzt den separaten assert-docker-disk-space-Schritt:
      # die Action prueft die ZIELplatte, bevor sie die data-root dorthin
      # verschiebt - frueher als eine Pruefung nach dem Cleanup, und auf genau
      # dem Laufwerk, auf dem das Image dann landet.
      - name: Prepare Windows container host
        id: prep
        uses: Kataglyphis/ContainerHub/.github/actions/prepare-windows-container-host@main
        with:
          registry-password: ${{ secrets.GHCR_PAT }}
          fetch-depth: 0
          short-path-target: /d/ws
          required-free-gb: '70'

      # Bind-mount target is C:\ws (a FRESH path), NOT C:\workspace. The image
      # bakes `WORKDIR C:\workspace` + `VOLUME ["C:\workspace"]` (windows/
      # Dockerfile:48-49); mounting a bind OVER that baked-in dir dies at
      # `hcs::CreateComputeSystem: The request is not supported` whenever the
      # host OS build differs from the image base build - and it does here: the
      # image is validated on a build-26200 host (ContainerHub BUILD-OBSERVATIONS)
      # while the github windows-2025 runner is 26100. ContainerHub's own
      # Test-ContainerBindMount defaults to a fresh C:\ws-mnt for exactly this.
      # D:\ws -> C:\ws and --memory 16g are the composite action's defaults, and
      # --cpus defaults to NUMBER_OF_PROCESSORS (min 2) - the identical
      # computation this step used to do inline.
      #
      # This step kept an inline `docker run` long after the others moved to the
      # composite action, because it is the only one that (a) passes a secret as
      # `-e VAR=value` and (b) runs `pwsh -File <script> <argv...>` rather than
      # `pwsh -Command <text>`. Both now have first-class inputs: `extra-args`
      # and `file`/`file-args`, each one argv element per line, each delivered to
      # the action through an env var instead of being interpolated into its
      # script - so the secrets still never enter a host command STRING, and the
      # script arguments are still literal (never re-parsed by PowerShell, which
      # is what a rewrite to `-Command` would have done to them).
      # Caveat of the line-per-argument encoding: a secret whose value contains
      # a newline cannot be expressed. None of these are multi-line (passwords,
      # a hostname, a username, a remote path).
      - name: Build/Test/Package inside the Windows CI container
        continue-on-error: false
        uses: Kataglyphis/ContainerHub/.github/actions/run-in-windows-container@main
        with:
          extra-args: |
            -e
            MSIX_CERT_PASSWORD=${{ secrets.MSIX_CERT_PASSWORD }}
          file: C:\ws\scripts\windows\Build-Windows.ps1
          # clangcl-profile is deliberately NOT built here. Nothing in this
          # workflow consumes it: the CPU tests and fuzz seeds run out of
          # build-clangcl-debug, the artifacts come from build-clangcl-release,
          # and the step already passes -SkipPerfTests, so the profiling
          # build's only purpose is skipped. Building it cost roughly a third
          # of the compile time for nothing. Re-add it the day CI actually
          # runs the perf suite.
          file-args: |
            -Configurations
            clangcl-debug,clangcl-release
            -SkipFormat
            -SkipTidy
            -SkipTests
            -SkipPerfTests
            -WebDavHostname
            ${{ secrets.WEBDAV_HOSTNAME }}
            -WebDavUsername
            ${{ secrets.WEBDAV_USERNAME }}
            -WebDavPassword
            ${{ secrets.WEBDAV_PASSWORD }}
            -RemoteBasePath
            ${{ secrets.REMOTE_BASE_PATH }}
            -LocalAssetsFolder
            C:\ws

      # Until 2026-07-20 this workflow passed -SkipTests -SkipPerfTests and
      # nothing else ran, so Windows CI proved only that the code compiles -
      # every behavioural guarantee came from a human running the suite locally.
      #
      # The build step above still skips ctest deliberately. GitHub's hosted
      # runners have no GPU, but the container DOES ship the Vulkan loader, so
      # the GPU suites do not reliably self-skip: SKIP_WITHOUT_GPU only asks
      # glfwVulkanSupported(), which can answer yes on a machine with a loader
      # and no device, after which device creation aborts the process. So the
      # GPU suites (Integration, GoldenRender) stay out, by name rather than by
      # hoping they skip, and the CPU-only ones run here.
      #
      # New suites now run automatically; nothing to add here.
      # The GPU-only suite list is built HOST-side and the container is handed
      # one flat command line, which is how the last green Windows run
      # (2026-07-21) did it: it composed `$cmd` on the runner and passed that
      # single string to `powershell.exe -Command`. When the step moved to the
      # composite action the whole multi-line script started being passed to
      # `pwsh -Command` instead, and no Windows run reached this step again
      # until 2026-08-05 - where the container produced ZERO output and exited
      # 1 after 12 s, far too fast for a 650-test suite and with none of
      # gtest's banner. The action's other user here, the build step, passes
      # `file:` (an argv list), not a multi-line `-Command` payload; the
      # timing/pixel steps below use folded single-line commands. This step is
      # now the same shape as those.
      #
      # The array below stays multi-line and stays in THIS file on purpose:
      # BuildIntegrity.WindowsCiExcludesExactlyTheGpuSuites parses it across
      # lines out of the workflow, from its opening line to its joining line,
      # so collapsing it to one line would fail that test with "parsed zero
      # suites". For the same reason this comment does not spell either of
      # those two anchor strings out - the parser takes the first line that
      # matches.
      - name: Determine the GPU-only suite filter
        shell: pwsh
        run: |
          $gpuOnlySuites = @(
            'GoldenRender.*'
            'Integration.*'
          ) -join ':'
          Write-Host "Excluding GPU-only suites: $gpuOnlySuites"
          "GPU_ONLY_SUITES=$gpuOnlySuites" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run CPU-only tests inside the container
        uses: Kataglyphis/ContainerHub/.github/actions/run-in-windows-container@main
        with:
          # Test-Path first: a missing or unbuilt executable must say so, not
          # surface as a bare "exit code 1" with an empty log the way the
          # 2026-08-05 run did.
          command: >-
            $exe = 'C:\ws\build-clangcl-debug\commitTestSuite.exe';
            if (-not (Test-Path $exe)) { Write-Host ('::error::missing ' + $exe); exit 1 };
            Write-Host ('running ' + $exe + ' (' + (Get-Item $exe).Length + ' bytes)');
            & $exe --gtest_filter='-${{ env.GPU_ONLY_SUITES }}';
            exit $LASTEXITCODE

      # Fuzz targets run their seed corpus in unit-test mode - fast, CPU-only,
      # and the shader-file reader target found a real terminate-on-throw bug
      # from a seed on its first run.
      #
      # timeout-minutes because this step is where a hang actually happened:
      # the "con" seed spent 68 minutes inside readTextFile on 2026-08-05 (see
      # FileReader.ixx) and the run had to be killed by hand rather than going
      # red. Seven targets need about a minute in total; 20 leaves room for a
      # cold container start and still fails the same day.
      - name: Run fuzz target seeds inside the container
        timeout-minutes: 20
        uses: Kataglyphis/ContainerHub/.github/actions/run-in-windows-container@main
        with:
          # Inner strings use single quotes and concatenation, NOT \" escapes:
          # backslash is not an escape character in PowerShell (backtick is), so
          # \" terminated the surrounding double-quoted string and the whole
          # command died with "Unexpected token 'missing'". This step had never
          # actually run before - every earlier attempt died at the docker run in
          # the build step - so the bug sat latent until the container finally
          # built successfully.
          # Folded to ONE line for the same reason as the CPU-test step above:
          # a multi-line payload to `pwsh -Command` is not a shape this action
          # has ever been observed to run. Every line here is indented
          # identically - a more-indented line in a YAML folded scalar keeps
          # its newlines instead of being joined, which would quietly put the
          # multi-line shape back.
          #
          # The loop's target list stays on a single line below because
          # BuildIntegrity.EveryRegisteredFuzzTargetRunsInCi and
          # EveryFuzzTargetIsInTheWindowsCiFuzzList parse that one line out of
          # this file. Do not spell the loop's opening text in a comment
          # either: both parsers take the FIRST line that matches it, so a
          # comment quoting it wins over the real list and they fail with
          # "parsed zero fuzz targets".
          #
          # It collects every failure instead of stopping at the first, as the
          # Linux lane's loop now does: seven targets and a ~2.5 h round trip
          # means aborting early costs a whole run per broken fuzzer.
          command: >-
            $failed = @();
            foreach ($t in @('first_fuzz_test','example_fuzz_test','obj_parsing_fuzz_test','gltf_parsing_fuzz_test','scene_config_fuzz_test','shader_file_reader_fuzz_test','texture_loading_fuzz_test')) { $exe = Join-Path 'C:\ws\build-clangcl-debug' ($t + '.exe'); if (-not (Test-Path $exe)) { Write-Host ('::error::missing ' + $exe + ' - fuzz targets are Debug+clang-cl only'); $failed += $t; continue }; Write-Host ('--- ' + $t); & $exe; if ($LASTEXITCODE -ne 0) { Write-Host ('::error::fuzz target ' + $t + ' failed'); $failed += $t } else { Write-Host ('--- ' + $t + ' OK') } };
            if ($failed.Count -gt 0) { Write-Host ('::error::fuzz targets failed: ' + ($failed -join ' ')); exit 1 };
            exit 0

      # GPU timing comparison — runs the Compare-RendererTimings.ps1 script
      # which drives both renderers headlessly and prints per-pass GPU ms side
      # by side.  GitHub-hosted runners have no GPU (Vulkan loader present but
      # no device), so this step is validation-only by default: it checks the
      # JSON schema and pass names without actually rendering.  There is no
      # reliable in-container GPU probe — `glfwVulkanSupported()` can answer
      # yes with no device present and then abort during device creation, and
      # `--gtest_list_tests` only enumerates registered names, never touching
      # a device, so it always "succeeds". A self-hosted runner with a real
      # adapter opts in explicitly by setting the KATAGLYPHIS_CI_HAS_GPU
      # repository/environment variable to '1', which drops -ValidationOnly
      # for a full timing comparison.
      # The GPU probe must run on the HOST (the repository/environment
      # variable is runner-side and unreachable from inside the container),
      # so a small host step computes the flag and the container step below
      # consumes it through the shared composite action.
      - name: Determine GPU timing mode
        shell: pwsh
        run: |
          $hasGpu = $env:KATAGLYPHIS_CI_HAS_GPU -eq '1'
          $flag = if (-not $hasGpu) { '-ValidationOnly' } else { '' }
          Write-Host "GPU available: $hasGpu (validation flag: $($flag -replace '-',''))"
          "TIMING_VALIDATION_FLAG=$flag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: GPU timing comparison (validation-only on GPU-less runners)
        uses: Kataglyphis/ContainerHub/.github/actions/run-in-windows-container@main
        with:
          command: >-
            & 'C:\ws\scripts\Compare-RendererTimings.ps1' -RepoRoot C:\ws ${{ env.TIMING_VALIDATION_FLAG }}; exit $LASTEXITCODE

      # Cross-renderer pixel comparison. Uses the same GPU-less flag as the
      # timing step above, so a self-hosted runner with an adapter does a real
      # comparison instead of the degenerate one.
      #
      # Exit 2 is the script's documented "nothing was checked" code, kept
      # deliberately distinct from 1 ("a frame was found and it regressed")
      # and pinned by Compare-RendererPixels.Tests.ps1 - an empty run used to
      # report PASSED, and that silent green was fixed on purpose. Do not
      # "fix" this by making the script return 0.
      #
      # On a GPU-less runner there are never any frames, so 2 is the
      # GUARANTEED outcome and this step could never pass: it failed the first
      # Windows run that ever reached it (2026-08-05), after the CPU tests,
      # the fuzz seeds and the timing comparison had all gone green. So 2 is
      # tolerated here, but ONLY while -ValidationOnly is in effect, and it is
      # announced as a warning - a run that checked nothing must never read as
      # a run that verified something. With KATAGLYPHIS_CI_HAS_GPU=1 the flag
      # is empty and 2 stays fatal, because then frames SHOULD exist.
      - name: Pixel comparison (validation-only on GPU-less runners)
        uses: Kataglyphis/ContainerHub/.github/actions/run-in-windows-container@main
        with:
          command: >-
            & 'C:\ws\scripts\Compare-RendererPixels.ps1' -RepoRoot C:\ws ${{ env.TIMING_VALIDATION_FLAG }};
            $code = $LASTEXITCODE;
            if ($code -eq 2 -and '${{ env.TIMING_VALIDATION_FLAG }}'.Length -gt 0) { Write-Host '::warning::Pixel comparison checked NOTHING - this runner has no GPU, so no frames were captured (script exit 2). That is not a pass, only an absence of evidence.'; exit 0 };
            exit $code

      # I limited the size of the builded package for storage restriction reasons on a github runner
      # see also the install commands in the bottom of the CMakeLists.txt
      - name: Upload Installers & Zip
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-installers-container
          path: |
            ${{ steps.prep.outputs.workspace }}/build-clangcl-release/**/*.msi
            ${{ steps.prep.outputs.workspace }}/build-clangcl-release/**/*.msix
            ${{ steps.prep.outputs.workspace }}/build-clangcl-release/**/*.exe
            ${{ steps.prep.outputs.workspace }}/build-clangcl-release/**/*.zip
            ${{ steps.prep.outputs.workspace }}/build-clangcl-release/**/*.dll
            ${{ steps.prep.outputs.workspace }}/build-clangcl-release/**/*.lib


  # CPU-only, container-free: the PowerShell module Pester suites (this repo's
  # scripts/windows/tests, written for Pester 3.4 syntax — pinned install, the
  # runner's default Pester 5 cannot parse them). Cheap gate for the module
  # moves to ContainerHub: every module must still resolve and behave.
  pester-tests:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-win]')
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      # `submodules: true` is top-level only (NOT recursive) - exactly what these
      # suites need: they resolve their modules and shared config out of the
      # ContainerHub submodule, so that one working tree must be present, and
      # none of the nested ones are read. (The pin-drift suite that also needed
      # a non-recursive `git submodule status` is no longer here: it moved to
      # the always-on `submodule-pins` job below, which does its own checkout.)
      #
      # It must be actions/checkout doing this, not a hand-rolled
      # `git submodule update --init` step. .gitmodules pins git@github.com:
      # (SSH) URLs for ContainerHub and OxidANT,
      # and a hosted runner has no SSH key - the bare git command died with
      # "git@github.com: Permission denied (publickey)" on both, every single run.
      # checkout's submodule support installs the same `url.<https>.insteadOf
      # git@github.com:` rewrite plus token auth that the build job's clone step
      # sets up by hand, so the SSH pins resolve over HTTPS.
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: true

      # Pinned version, not the runner's default: these suites are written in
      # Pester 3.4's dash-less assertion syntax (`Should Be 0`), which the
      # Pester 5 on the runner cannot parse. The install/run/report mechanics
      # are generic and live in ContainerHub.
      - name: Run Pester suites (pinned 3.4.0)
        uses: Kataglyphis/ContainerHub/.github/actions/run-pester-suite@main
        with:
          path: scripts/windows/tests
          version: '3.4.0'

  # ===========================================================================
  # ALWAYS-ON gates. Everything above carries
  #   if: workflow_dispatch || contains(head_commit.message, '[build-win]')
  # because it costs a 2-3h containerised build. Neither job below builds
  # anything - both are CPU-only, container-free and finish in minutes - so
  # neither carries that condition.
  #
  # That is the point, not an oversight: an invariant that only runs when
  # somebody remembers to type [build-win] is not a gate. The submodule-pin
  # check in particular was reachable ONLY through the opt-in job above, which
  # means the pins were unguarded on exactly the pushes nobody thought needed
  # checking.
  # ===========================================================================

  # PowerShell lint: ContainerHub's Invoke-Lint.ps1 pointed at THIS repo's
  # PowerShell tree. Two passes - a mandatory parse + AST-trap gate, and
  # PSScriptAnalyzer.
  #
  # Runs on Windows rather than being folded into Linux.yml's lint job on
  # purpose: the script is Windows-native (it resolves its own helper module with
  # a backslash path and excludes `\archive\` by a backslash regex), and
  # PSScriptAnalyzer is preinstalled on the hosted Windows image.
  powershell-lint:
    name: PowerShell lint (ContainerHub gate)
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      # Top-level only: the only submodule these steps read is ContainerHub,
      # which carries both the gate script and its ruleset.
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: true
          fetch-depth: 1

      # Pinned, like the hub pins it for its own lane, so a runner-image module
      # refresh cannot silently change what this gate reports.
      - name: Install PSScriptAnalyzer
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser

      # -Path is the parameter ContainerHub added for exactly this case: a
      # consumer points the gate at ITS tree, while the PSScriptAnalyzer settings
      # file stays resolved against the SCRIPT's own location - so the hub's
      # PSScriptAnalyzerSettings.psd1 is consumed BY REFERENCE and no ruleset is
      # copied into this repo. `scripts` is walked recursively, so scripts\,
      # scripts\windows\, scripts\windows\tests\ and scripts\agentic-loop\ are all
      # covered; the dead archive\ tree at the repo root is deliberately outside
      # the scope.
      #
      # -FailOnAnalyzer is deliberately NOT passed, and this step deliberately
      # carries no continue-on-error - those are not the same thing. The step
      # FAILS the job on any parse error or AST-trap violation, which are hard
      # code defects. What is advisory is only the PSScriptAnalyzer pass, and
      # that ramp is the hub's own documented one: its
      # PSScriptAnalyzerSettings.psd1 opens with "Deliberately lenient to start
      # ... Tighten over time", and Invoke-Lint.ps1's own parameter help records
      # that the analyzer is advisory unless -FailOnAnalyzer is given. Add
      # -FailOnAnalyzer here once this repo's analyzer findings are triaged; do
      # not reach for continue-on-error, which would hide the parse gate too.
      - name: Lint PowerShell (parse gate + PSScriptAnalyzer)
        run: >-
          pwsh -NoProfile -File third_party/ContainerHub/windows/scripts/Invoke-Lint.ps1
          -Path scripts

  # Submodule pins sit at their recorded, restorable commits.
  #
  # The suite is ContainerHub's promoted, repo-agnostic one - not a copy. It
  # asserts, for EVERY configured submodule (this repo has 15), that it is
  # checked out, sitting at its recorded gitlink, and pinned to a commit
  # reachable from its remote. A pin that is on no remote branch cannot be
  # restored by a fresh clone, which turns local drift into a build that only
  # works on the machine that made it.
  #
  # windows-2025, matching the hub's own submodule-pins lane, because
  # run-pester-suite installs Pester 3.4.0 - a Windows PowerShell-era module. The
  # suite itself asserts with plain `throw` rather than `Should`, so it is
  # dialect-agnostic and can move to a cheaper runner whenever the action can be
  # told a Core-compatible version.
  submodule-pins:
    name: submodule pins
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # The suite takes the superproject root as a parameter and the composite
      # action can only pass a path, so the root comes through the environment.
      # It would fall back to GITHUB_WORKSPACE by itself; naming it keeps the
      # wiring visible rather than implied. It must NOT be left to the suite's
      # last-resort git-toplevel probe either: the file lives inside the
      # ContainerHub submodule, so that probe would answer "ContainerHub".
      CONTAINERHUB_PIN_CHECK_REPO_ROOT: ${{ github.workspace }}
    steps:
      # `submodules: true` is required, not an optimisation: without it nothing
      # is checked out, and the suite fails on its own vacuity guard rather than
      # passing over an empty tree. Top-level only, because the drift check is
      # non-recursive for the same reason. Default fetch depth, which is what
      # makes the reachability check exercise its shallow-clone escalation.
      #
      # It must be actions/checkout doing this, not a hand-rolled
      # `git submodule update --init` step. .gitmodules pins git@github.com:
      # (SSH) URLs for ContainerHub and OxidANT, and a hosted runner has no SSH
      # key - the bare git command dies with "Permission denied (publickey)".
      # checkout installs the `url.<https>.insteadOf git@github.com:` rewrite
      # plus token auth, so the SSH pins resolve over HTTPS.
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - name: Submodule pins sit at their recorded, restorable commits
        uses: Kataglyphis/ContainerHub/.github/actions/run-pester-suite@main
        with:
          path: third_party/ContainerHub/shared/windows/tests/Submodule.Pins.Tests.ps1
