name: Linux · reusable build

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
    secrets:
      SERVER:
        required: true
      USERNAME:
        required: true
      PW:
        required: true
      CODECOV_TOKEN:
        required: true
      GHCR_PAT:
        required: true

# Least privilege: a job that needs more says so itself (the compiler-cache writers).
permissions:
  contents: read

# Explicit `shell: bash` adds pipefail; the default shell lets a failure piped through `tee` pass.
defaults:
  run:
    shell: bash

env:
  BUILD_TYPE: Debug
  GCC_PROFILE_PRESET: linux-profile-GNU
  CLANG_PROFILE_PRESET: linux-profile-clang
  # No VULKAN_VERSION here: the image exports it.
  BUILD_DIR: build
  BUILD_RELEASE_DIR: build-release
  DOCS_OUT: build/build/html
  COVERAGE_JSON: build/coverage.json
  # Never pass `image:` to the container actions: an expression that resolves empty overrides their default.

# No `needs:` on purpose: each job builds what it tests, cheaper than shipping a build tree between jobs.
jobs:
  # clang: Debug build and the unit/integration suite
  clang-tests:
    name: clang debug + tests
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      # compiler-cache-save deletes this key's older cache entries.
      actions: write
    steps:
      - name: Prepare host
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-linux-ci-host@develop
        with:
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_PAT }}

      # The one writer of the debug cache; coverage and static-analysis only restore it.
      - name: Restore compiler cache
        id: cc
        uses: Kataglyphis/ANTfrastructure/.github/actions/compiler-cache-restore@develop
        with:
          key: ${{ runner.arch }}-clang-debug
          mounts: 'sccache:/var/cache/sccache'
          env: 'SCCACHE_CACHE_SIZE=1500M'

      - name: Prepare for unit/integration tests
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          extra-args: ${{ steps.cc.outputs.docker-args }}
          script: >-
            bash ./scripts/linux/cmake-configure-build.sh
            --preset "linux-debug-clang"
            --build-dir "${{ env.BUILD_DIR }}"
          log-file: output.log

      - name: Save compiler cache
        if: always() && steps.cc.outputs.path != ''
        uses: Kataglyphis/ANTfrastructure/.github/actions/compiler-cache-save@develop
        with:
          key: ${{ runner.arch }}-clang-debug

      # The only lane running the GPU suites (x64 llvmpipe); exclusions: BACKLOG.md "GPU suites on llvmpipe".
      - name: Run Unit/Integration tests
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          script: >-
            bash ./scripts/linux/run-ctest.sh --virtual-display
            --build-dir "${{ env.BUILD_DIR }}"
            --build-type "${{ env.BUILD_TYPE }}"
            --ctest-exclude "${{ runner.arch == 'X64' && '^BuildIntegrity\.CompiledShadersAreNotOlder|^GoldenRender\.(ShadowsMoveWhenTheLightRotates|EmissiveMaterialBrightensTheFrame|MaskCardDiscardsCutoutTexelsInRaytracing|PathTracedMaskCardShowsItsCutout|AddedModelAppearsInPathTracing|GuiInputSweepNeverCrashesOrLosesTheDevice)$' || '^(Integration|GoldenRender)\.|^BuildIntegrity\.CompiledShadersAreNotOlder' }}"
          log-file: output.log

  # AddressSanitizer + UBSan and the fuzz seeds, which SEGV without project-wide ASan (Test/fuzz/CMakeLists.txt)
  asan:
    name: AddressSanitizer + fuzz seeds
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      # compiler-cache-save deletes this key's older cache entries.
      actions: write
    steps:
      - name: Prepare host
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-linux-ci-host@develop
        with:
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_PAT }}

      # x64 only: the 10 GB cache quota cannot hold every preset on both arches.
      - name: Restore compiler cache
        id: cc
        if: runner.arch == 'X64'
        uses: Kataglyphis/ANTfrastructure/.github/actions/compiler-cache-restore@develop
        with:
          key: ${{ runner.arch }}-clang-asan
          mounts: 'sccache:/var/cache/sccache'
          env: 'SCCACHE_CACHE_SIZE=1500M'

      - name: Configure/build with AddressSanitizer
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          extra-args: ${{ steps.cc.outputs.docker-args }}
          script: >-
            bash ./scripts/linux/cmake-configure-build.sh
            --preset "linux-debug-asan-clang"
            --build-dir "build-asan-clang"
          log-file: output-asan.log

      - name: Save compiler cache
        if: always() && steps.cc.outputs.path != ''
        uses: Kataglyphis/ANTfrastructure/.github/actions/compiler-cache-save@develop
        with:
          key: ${{ runner.arch }}-clang-asan

      # EveryRegisteredFuzzTargetRunsInCi parses the loop line: keep it one line, never quote it in a comment.
      - name: Run fuzzer tests
        timeout-minutes: 15
        run: |
          image="$(bash ./scripts/linux/ci-image-ref.sh)"
          echo "fuzz seeds run in ${image}"
          failed=""
          for t in first_fuzz_test example_fuzz_test obj_parsing_fuzz_test gltf_parsing_fuzz_test scene_config_fuzz_test shader_file_reader_fuzz_test texture_loading_fuzz_test; do
            exe="build-asan-clang/$t"
            test -x "$exe" || { echo "missing $exe"; exit 1; }
            echo "--- $t"
            if docker run --rm \
                 -v "${{ github.workspace }}:/workspace" \
                 -w /workspace \
                 "${image}" \
                 "./$exe"; then
              echo "--- $t OK"
            else
              echo "::error::fuzz target $t failed"
              failed="$failed $t"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::fuzz targets failed:$failed"
            exit 1
          fi
        working-directory: ${{ github.workspace }}

      - name: Run tests under AddressSanitizer
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          extra-args: >-
            -e ASAN_OPTIONS="detect_leaks=1:abort_on_error=1"
            -e UBSAN_OPTIONS="print_stacktrace=1:halt_on_error=1"
          script: >-
            bash ./scripts/linux/run-ctest.sh
            --build-dir "build-asan-clang"
            --build-type "${{ env.BUILD_TYPE }}"
            --ctest-exclude "^(Integration|GoldenRender)\.|^BuildIntegrity\.CompiledShadersAreNotOlder"
          log-file: output-asan.log

  # ThreadSanitizer
  tsan:
    name: ThreadSanitizer
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      # compiler-cache-save deletes this key's older cache entries.
      actions: write
    steps:
      - name: Prepare host
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-linux-ci-host@develop
        with:
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_PAT }}

      - name: Restore compiler cache
        id: cc
        if: runner.arch == 'X64'
        uses: Kataglyphis/ANTfrastructure/.github/actions/compiler-cache-restore@develop
        with:
          key: ${{ runner.arch }}-clang-tsan
          mounts: 'sccache:/var/cache/sccache'
          env: 'SCCACHE_CACHE_SIZE=1500M'

      - name: Configure/build with ThreadSanitizer
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          extra-args: ${{ steps.cc.outputs.docker-args }}
          script: >-
            bash ./scripts/linux/cmake-configure-build.sh
            --preset "linux-debug-tsan-clang"
            --build-dir "build-tsan"
          log-file: output-tsan.log

      - name: Save compiler cache
        if: always() && steps.cc.outputs.path != ''
        uses: Kataglyphis/ANTfrastructure/.github/actions/compiler-cache-save@develop
        with:
          key: ${{ runner.arch }}-clang-tsan

      # TSan's fixed shadow ranges collide with 32 bits of ASLR entropy, and it cannot re-exec inside the container.
      - name: Lower ASLR entropy for ThreadSanitizer
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Run tests under ThreadSanitizer
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          extra-args: >-
            -e TSAN_OPTIONS="halt_on_error=1:second_deadlock_stack=1"
          script: >-
            bash ./scripts/linux/run-ctest.sh
            --build-dir "build-tsan"
            --build-type "${{ env.BUILD_TYPE }}"
            --ctest-exclude "^(Integration|GoldenRender)\.|^BuildIntegrity\.CompiledShadersAreNotOlder"
          log-file: output-tsan.log

  # Coverage: builds its own tree, since build-coverage-llvm.sh runs compileTestSuite
  coverage:
    name: coverage + codecov
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Prepare host
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-linux-ci-host@develop
        with:
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_PAT }}

      # Reads clang-tests' debug cache: same preset, same objects.
      - name: Restore compiler cache
        id: cc
        uses: Kataglyphis/ANTfrastructure/.github/actions/compiler-cache-restore@develop
        with:
          key: ${{ runner.arch }}-clang-debug
          mounts: 'sccache:/var/cache/sccache'
          env: 'SCCACHE_CACHE_SIZE=1500M'

      - name: Build for coverage
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          extra-args: ${{ steps.cc.outputs.docker-args }}
          script: >-
            bash ./scripts/linux/cmake-configure-build.sh
            --preset "linux-debug-clang"
            --build-dir "${{ env.BUILD_DIR }}"
          log-file: output.log

      - name: Build Code Coverage
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          extra-args: ${{ steps.cc.outputs.docker-args }}
          script: >-
            bash ./scripts/linux/build-coverage-llvm.sh
            --build-dir "${{ env.BUILD_DIR }}"
            --coverage-json "${{ env.COVERAGE_JSON }}"
          log-file: output.log

      - name: Codecov
        if: ${{ inputs.runner == 'ubuntu-26.04' }}
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ env.COVERAGE_JSON }}
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: false

  # Static analysis (advisory: continue-on-error)
  static-analysis:
    name: clang static analysis
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Prepare host
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-linux-ci-host@develop
        with:
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_PAT }}

      # Reads clang-tests' debug cache: same preset, same objects.
      - name: Restore compiler cache
        id: cc
        uses: Kataglyphis/ANTfrastructure/.github/actions/compiler-cache-restore@develop
        with:
          key: ${{ runner.arch }}-clang-debug
          mounts: 'sccache:/var/cache/sccache'
          env: 'SCCACHE_CACHE_SIZE=1500M'

      # run-static-analysis-format.sh needs ${BUILD_DIR}/compile_commands.json.
      - name: Configure/build for analysis
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          extra-args: ${{ steps.cc.outputs.docker-args }}
          script: >-
            bash ./scripts/linux/cmake-configure-build.sh
            --preset "linux-debug-clang"
            --build-dir "${{ env.BUILD_DIR }}"
          log-file: output.log

      # No --gcc-toolchain needed: the image's <triple>-clang++.cfg selects its GCC for a bare clang++.
      - name: Run Clang static analysis (HTML)
        continue-on-error: true
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          script: >-
            bash ./scripts/linux/run-static-analysis-format.sh
            --only-clang-analyze-html
          log-file: output.log

      - name: Run Clang static analysis (scan-build)
        continue-on-error: true
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          script: >-
            bash ./scripts/linux/run-static-analysis-format.sh
            --only-scan-build
            --build-dir "${{ env.BUILD_DIR }}"
            --preset "linux-debug-clang"
          log-file: output.log

  # clang profiling build + perf suite
  profiling:
    name: clang profiling + benchmarks
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      # compiler-cache-save deletes this key's older cache entries.
      actions: write
    steps:
      - name: Prepare host
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-linux-ci-host@develop
        with:
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_PAT }}

      - name: Restore compiler cache
        id: cc
        if: runner.arch == 'X64'
        uses: Kataglyphis/ANTfrastructure/.github/actions/compiler-cache-restore@develop
        with:
          key: ${{ runner.arch }}-clang-profile
          mounts: 'sccache:/var/cache/sccache'
          env: 'SCCACHE_CACHE_SIZE=1500M'

      - name: Configure/build CMake for Profiling (select preset by compiler)
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          extra-args: ${{ steps.cc.outputs.docker-args }}
          script: >-
            bash ./scripts/linux/cmake-configure-build.sh
            --build-dir "${{ env.BUILD_DIR }}"
            --preset "${{ env.CLANG_PROFILE_PRESET }}"
            --clean-build-dir true
          log-file: output.log

      - name: Save compiler cache
        if: always() && steps.cc.outputs.path != ''
        uses: Kataglyphis/ANTfrastructure/.github/actions/compiler-cache-save@develop
        with:
          key: ${{ runner.arch }}-clang-profile

      - name: Run performance benchmarks
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          script: bash ./scripts/linux/run-perf-suite.sh "${{ env.BUILD_DIR }}"
          log-file: output.log

  # Rust renderer tests: the only place the crate's tests run; x64 only
  rust:
    name: Rust renderer tests
    if: ${{ inputs.runner == 'ubuntu-26.04' }}
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Prepare host
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-linux-ci-host@develop
        with:
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_PAT }}

      - name: Run Rust renderer tests
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          script: bash ./scripts/linux/run-cargo-tests.sh
          log-file: output.log

  # Docs + wasm demo + deploy; doc_doxygen has no compiled dependencies, so no engine build
  docs:
    name: docs + wasm demo
    if: ${{ inputs.runner == 'ubuntu-26.04' }}
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Prepare host
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-linux-ci-host@develop
        with:
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_PAT }}

      - name: Generate Doxygen XML
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          script: >-
            bash ./scripts/linux/cmake-configure-build.sh
            --preset "linux-debug-clang"
            --build-dir "${{ env.BUILD_DIR }}"
            --build-target doc_doxygen
          log-file: output.log

      - name: Build web page
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          script: bash ./scripts/linux/docs-build-web.sh "${{ env.DOCS_OUT }}"

      - name: Enforce wasm demo size budget
        # Fatal on purpose: a wasm bloat regression must block the deploy below.
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          script: bash ./scripts/linux/wasm-size-budget.sh

      - name: 📂 Sync files to domain
        uses: Kataglyphis/ANTfrastructure/.github/actions/deploy-over-ftp@develop
        # A manual dispatch (any branch) never deploys.
        if: github.event_name != 'workflow_dispatch'
        # A flaky docs FTP upload must not fail the build+test lane.
        continue-on-error: true
        with:
          server: ${{ secrets.SERVER }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PW }}
          local-dir: "./docs/build/html/"

  # gcc: build, tests, coverage; no compiler cache, since neither ccache nor sccache caches -fmodules-ts TUs
  gcc:
    name: gcc + tests + coverage
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Prepare host
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-linux-ci-host@develop
        with:
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_PAT }}

      - name: Prepare for unit/integration tests (gcc)
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          script: >-
            bash ./scripts/linux/cmake-configure-build.sh
            --build-dir "${{ env.BUILD_DIR }}"
            --preset "linux-debug-GNU"
            --clean-build-dir true
          log-file: output.log

      - name: Run Unit/Integration tests (gcc)
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          script: >-
            bash ./scripts/linux/run-ctest.sh
            --build-dir "${{ env.BUILD_DIR }}"
            --build-type "${{ env.BUILD_TYPE }}"
            --ctest-exclude "^(Integration|GoldenRender)\\.|^BuildIntegrity\\.CompiledShadersAreNotOlder"
          log-file: output.log

      # No fuzz step: Test/fuzz/CMakeLists.txt builds its targets under clang only.

      # gcovr reads the .gcda files the ctest run above left, so it stays in this job.
      - name: Build Code Coverage (gcc)
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          script: bash ./scripts/linux/build-coverage-gcovr.sh
          log-file: output.log

  # gcc profiling + benchmarks: its own job because it wipes the build directory
  gcc-profiling:
    name: gcc profiling + benchmarks
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Prepare host
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-linux-ci-host@develop
        with:
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_PAT }}

      - name: Configure/build CMake for Profiling (gcc)
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          script: >-
            bash ./scripts/linux/cmake-configure-build.sh
            --build-dir "${{ env.BUILD_DIR }}"
            --preset "${{ env.GCC_PROFILE_PRESET }}"
            --clean-build-dir true
          log-file: output.log

      # In the container: the binary links the image's /opt/gcc libstdc++, which the host lacks.
      - name: Run performance benchmarks (gcc)
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          script: bash ./scripts/linux/run-perf-suite.sh "${{ env.BUILD_DIR }}"
          log-file: output.log

  # Release build + packages
  release:
    name: release + package
    runs-on: ${{ inputs.runner }}
    # No compiler cache: it saved the least per GB, and the 10 GB quota holds only five presets.
    steps:
      - name: Prepare host
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-linux-ci-host@develop
        with:
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_PAT }}

      - name: Configure/build CMake for Release
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          script: >-
            bash ./scripts/linux/cmake-configure-build.sh
            --build-dir "${{ env.BUILD_RELEASE_DIR }}"
            --preset "linux-release-clang"
            --build-config "Release"
          log-file: output.log

      - name: Package
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          script: >-
            bash ./scripts/linux/cmake-configure-build.sh
            --build-dir "${{ env.BUILD_RELEASE_DIR }}"
            --skip-configure true
            --build-target package
          log-file: output.log

      - name: Upload Linux Packages (Clang only)
        uses: actions/upload-artifact@v7.0.1
        with:
          name: linux-packages
          path: |
            ${{ env.BUILD_RELEASE_DIR }}/*.tar.gz
            ${{ env.BUILD_RELEASE_DIR }}/*.tgz
            ${{ env.BUILD_RELEASE_DIR }}/*.deb
            ${{ env.BUILD_RELEASE_DIR }}/*.AppImage
            ${{ env.BUILD_RELEASE_DIR }}/*.flatpak
