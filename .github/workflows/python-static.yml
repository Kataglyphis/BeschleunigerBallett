name: Linux x64 · Python static analysis

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      strict:
        description: Fail on Ruff or ty findings
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  analyze:
    uses: Kataglyphis/ANTfrastructure/.github/workflows/python-static.yml@develop
    with:
      strict: ${{ inputs.strict == true }}
