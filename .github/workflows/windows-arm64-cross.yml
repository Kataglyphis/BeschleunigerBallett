name: Windows arm64 · cross build + test

# Release only: see third_party/ANTfrastructure/docs/windows-cross-builds.md.

on:
  push:
    branches: [main, develop]
    # Same rule as windows-x64.yml: a docs-only commit does not rebuild the engine.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

# Same rule as windows-x64.yml: superseded runs are cancelled, except on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  cross:
    name: Cross build (arm64)
    uses: Kataglyphis/ANTfrastructure/.github/workflows/container-ci-windows.yml@develop
    with:
      target-arch: arm64
      build-script: scripts/windows/Build-Windows.ps1
      # Format and tidy run on the x64 lane; the Release commit suite and the Profile perf suite are staged for windows-11-arm.
      build-args: |
        -TargetArch
        arm64
        -Configurations
        clangcl-release,clangcl-profile
        -SkipFormat
        -SkipTidy
        -SkipTests
        -SkipPerfTests
        -StageTests
      artifact-name: BeschleunigerBallett-windows-arm64
      artifact-dir: dist/windows-arm64
      # The engine and the VC++ runtime at the least.
      arch-gate-min-inspected: 2
      # The GPU-less runner lacks vulkan-1.dll, so CI borrows LunarG's pinned loader; the bundle never ships it.
      run-command: |
        $rt = 'VulkanRT-ARM64-1.4.357.0-Components'
        $zip = Join-Path $env:RUNNER_TEMP "$rt.zip"
        Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/1.4.357.0/warm/$rt.zip" -OutFile $zip
        $sha = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
        if ($sha -ne '0A51A619525E0C7A156125C4F80C4F591C494CEF9FF59DC4481735779A9A280C') { throw "$rt.zip is $sha, not the pinned build" }
        Expand-Archive -LiteralPath $zip -DestinationPath $env:RUNNER_TEMP -Force
        $env:PATH = "$(Join-Path $env:RUNNER_TEMP $rt);$env:PATH"
        ./bundle/bin/GraphicsEngine.exe --version
      # The commit suite (Release) and the perf suite (Profile), run natively; filter and list in tests.json (hub CON43).
      test-artifact-dir: dist/windows-arm64-tests
      test-command: |
        & ./Invoke-StagedTests.ps1
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}

  # GPU suites on lavapipe plus the source checks: its own job, as the hub's run job stops at 30 minutes.
  gpu-suites:
    name: GPU suites + source checks (arm64, lavapipe)
    needs: cross
    runs-on: windows-11-arm
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      # Top-level submodules: IMGUI's fonts, the hub's modules, OxidANT's checked-in WGSL for the source checks.
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - name: Download the tests
        uses: actions/download-artifact@v8.0.1
        with:
          name: BeschleunigerBallett-windows-arm64-tests
          path: dist/windows-arm64-tests

      # Compiled from this commit in the cross job, so they are newer than its sources, as BuildIntegrity checks.
      - name: Place the compiled shaders
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force dist/windows-arm64-tests/Resources/ShadersSlang/build Resources/ShadersSlang/build
          Get-ChildItem -Recurse -File Resources/ShadersSlang/build | ForEach-Object { $_.LastWriteTime = Get-Date }

      - name: Run them natively
        shell: pwsh
        run: >-
          ./scripts/windows/Invoke-LavapipeTests.ps1
          -Suite dist/windows-arm64-tests/commitTestSuite.exe
          -Filter 'GoldenRender.*:Integration.*:BuildIntegrity.*:RenderPassCreateHelperUnit.PostAndSkyboxPassesDeclareNoDepthAttachment:-GoldenRender.GuiInputSweepNeverCrashesOrLosesTheDevice'
