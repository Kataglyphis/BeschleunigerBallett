name: Windows arm64 · cross build + test

# Release, Profile and the ASan (Debug) suite: the aarch64 ASan runtime ships since 2026-10-03; see third_party/ANTfrastructure/docs/windows-cross-builds.md.


# On request only (https://github.com/Kataglyphis/ANTfrastructure/blob/develop/docs/branch-and-release-strategy.md): on-request.yml or by hand.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Per lane and caller (github.workflow is the caller's name when called); main's runs are never cancelled.
concurrency:
  group: windows-arm64-cross-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  cross:
    name: Cross build (arm64)
    uses: Kataglyphis/ANTfrastructure/.github/workflows/container-ci-windows.yml@develop
    with:
      target-arch: arm64
      submodules: 'true'
      build-script: scripts/windows/Build-Windows.ps1
      # Format and tidy run on the x64 lane; the Release commit suite, the Debug (ASan) suite and the Profile perf suite are staged for windows-11-arm.
      build-args: |
        -TargetArch
        arm64
        -Configurations
        clangcl-release,clangcl-profile,clangcl-debug
        -SkipFormat
        -SkipTidy
        -SkipTests
        -SkipPerfTests
        -StageTests
      artifact-name: BeschleunigerBallett-windows-arm64
      artifact-dir: dist/windows-arm64
      # The engine and the VC++ runtime at the least.
      arch-gate-min-inspected: 2
      # The GPU-less runner lacks vulkan-1.dll, so CI borrows LunarG's pinned loader; the bundle never ships it.
      run-command: |
        $rt = 'VulkanRT-ARM64-1.4.357.0-Components'
        $zip = Join-Path $env:RUNNER_TEMP "$rt.zip"
        Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/1.4.357.0/warm/$rt.zip" -OutFile $zip
        $sha = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
        if ($sha -ne '0A51A619525E0C7A156125C4F80C4F591C494CEF9FF59DC4481735779A9A280C') { throw "$rt.zip is $sha, not the pinned build" }
        Expand-Archive -LiteralPath $zip -DestinationPath $env:RUNNER_TEMP -Force
        $env:PATH = "$(Join-Path $env:RUNNER_TEMP $rt);$env:PATH"
        # The installed copy below needs the same loader.
        Add-Content -LiteralPath $env:GITHUB_PATH -Value (Join-Path $env:RUNNER_TEMP $rt)
        ./bundle/bin/GraphicsEngine.exe --version
      # The same engine, as the setup .exe installed it (the hub installs it, grades every binary ARM64, then uninstalls).
      installed-run-command: |
        ./bin/GraphicsEngine.exe --version
      # The commit suite (Release), the ASan suite (Debug, /MDd) and the perf suite (Profile), run natively; filter and list in tests.json (hub CON43).
      test-artifact-dir: dist/windows-arm64-tests
      test-command: |
        # A Debug (/MDd) ASan suite needs the runner's own debug CRT and ucrtbased.dll: neither is redistributable, so neither travels.
        $crt = @(Get-ChildItem 'C:\Program Files*\Microsoft Visual Studio\*\*\VC\Redist\MSVC\*\debug_nonredist\arm64\Microsoft.VC*.DebugCRT' -Directory -ErrorAction SilentlyContinue | Select-Object -First 1)
        if ($crt.Count -eq 0) { throw 'no arm64 debug CRT under the runner VS; the staged ASan suite is a /MDd build' }
        $ucrt = @(Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\arm64\ucrt\ucrtbased.dll' -File -ErrorAction SilentlyContinue | Select-Object -First 1)
        if ($ucrt.Count -eq 0) { throw 'no arm64 ucrtbased.dll under the Windows SDK' }
        $env:PATH = "$($crt[0].FullName);$($ucrt[0].DirectoryName);$env:PATH"
        & ./Invoke-StagedTests.ps1
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}

  # GPU suites on lavapipe plus the source checks: its own job, as the hub's run job stops at 30 minutes.
  gpu-suites:
    name: GPU suites + source checks (arm64, lavapipe)
    needs: cross
    runs-on: windows-11-arm
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      # Top-level submodules: IMGUI's fonts, the hub's modules, OxidANT's checked-in WGSL for the source checks.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Download the tests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: BeschleunigerBallett-windows-arm64-tests
          path: dist/windows-arm64-tests

      # Compiled from this commit in the cross job, so they are newer than its sources, as BuildIntegrity checks.
      - name: Place the compiled shaders
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force dist/windows-arm64-tests/Resources/ShadersSlang/build Resources/ShadersSlang/build
          Get-ChildItem -Recurse -File Resources/ShadersSlang/build | ForEach-Object { $_.LastWriteTime = Get-Date }

      # A checkout tracks no scenes; the goldens read the default ones from AssetANT, as a configure fetches them.
      - name: Fetch the scenes
        shell: pwsh
        run: cmake -P cmake/FetchAssets.cmake

      # An intermittent crash prints no gtest line (DeferredMatchesForwardRoughly, 2026-10-17); a dump names the frame.
      - name: Keep a crash dump of the suite
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\commitTestSuite.exe'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -Value "$env:RUNNER_TEMP\dumps" -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -Value 2 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpCount -Value 3 -PropertyType DWord -Force | Out-Null

      - name: Run them natively
        shell: pwsh
        env:
          KATAGLYPHIS_STAGED_WGSL_ROOT: ${{ github.workspace }}/dist/windows-arm64-tests/generated-wgsl
        run: >-
          ./scripts/windows/Invoke-LavapipeTests.ps1
          -Suite dist/windows-arm64-tests/commitTestSuite.exe
          -Filter 'GoldenRender.*:Integration.*:BuildIntegrity.*:RenderPassCreateHelperUnit.PostAndSkyboxPassesDeclareNoDepthAttachment:-GoldenRender.GuiInputSweepNeverCrashesOrLosesTheDevice'

      - name: Detect a crash dump
        id: crash_dump
        if: failure()
        shell: pwsh
        run: |
          $dumps = Join-Path $env:RUNNER_TEMP 'dumps'
          if (Get-ChildItem -LiteralPath $dumps -Filter '*.dmp' -File -ErrorAction SilentlyContinue | Select-Object -First 1) {
            'present=true' | Out-File -LiteralPath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Upload the crash dump
        if: ${{ failure() && steps.crash_dump.outputs.present == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arm64-lavapipe-crash-dump-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dumps/*.dmp
          if-no-files-found: error
