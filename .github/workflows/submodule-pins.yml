name: Submodule pins

# No paths filter: a commit can move a gitlink while touching only docs.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

permissions:
  contents: read

jobs:
  submodule-pins:
    name: submodule pins sit at their recorded, restorable commits
    uses: Kataglyphis/ANTfrastructure/.github/workflows/submodule-pins.yml@develop
    with:
      # Pinned so a hub default change cannot move the lane.
      pester-version: '6.2.0'
