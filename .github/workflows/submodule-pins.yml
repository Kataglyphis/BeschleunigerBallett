name: Submodule pins

# No paths filter: a commit can move a gitlink while touching only docs.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  submodule-pins:
    name: submodule pins sit at their recorded, restorable commits
    uses: Kataglyphis/ANTfrastructure/.github/workflows/submodule-pins.yml@develop
    with:
      # Explicit although it is the hub default: 5.x loses per-failure diagnostics and 6.x rejects -Quiet.
      pester-version: '3.4.0'
